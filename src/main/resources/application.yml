spring:
  application:
    name: okcare-health-backend

  autoconfigure:
    exclude:
      # UserDetailsService 계열 빈이 하나도 없으면 Spring Boot가 기본 사용자를 만들고 임의
      # 비밀번호 평문을 시작 로그에 남김. SecurityFilterChain을 정의해도 그 조건은 해제되지
      # 않음. 인증은 Bearer 토큰 필터가 담당하므로 사용자명·비밀번호 인증 자체가 불필요.
      # @SpringBootApplication(exclude = ...)로 두지 않는 이유는 그 방식이 @WebMvcTest 같은
      # 슬라이스 컨텍스트에 전파되지 않아 테스트 로그에 비밀번호가 계속 남기 때문.
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    # 기본값을 두지 않음. 설정이 빠지면 placeholder 해석이 실패해 기동이 멈춤.
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?characterEncoding=UTF-8&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    # 스키마의 단일 소유자는 Flyway. Hibernate는 검증만 수행.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # JDBC 세션 타임존을 고정하지 않으면 서버 로캘에 따라 저장 시각이 달라짐.
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

management:
  endpoints:
    web:
      exposure:
        # 인증이 없는 엔드포인트이므로 health 외에는 비공개.
        include: health
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
    redis:
      enabled: true
    # 확인 대상은 MySQL과 Redis 연결. 디스크 경로·용량과 SSL 체인은 인증 없이 노출할 이유가
    # 없어 비활성화.
    diskspace:
      enabled: false
    ssl:
      enabled: false

app:
  # Daily/Monthly 집계 기준 타임존.
  business-zone: Asia/Seoul

  jwt:
    # Base64로 인코딩한 값. 디코딩 후 32바이트 미만이거나 Base64가 아니면 기동이 멈춤.
    # 토큰 유효시간은 응답 계약값이라 설정으로 열지 않고 코드 상수로 고정.
    secret: ${JWT_SECRET}
