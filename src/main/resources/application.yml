spring:
  application:
    name: okcare-health-backend

  autoconfigure:
    exclude:
      # 기본 사용자 자동 구성과 평문 비밀번호 로그 방지.
      # @SpringBootApplication의 exclude는 테스트 슬라이스에 전파되지 않아
      # spring.autoconfigure.exclude로 제외.
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    # 기본값을 두지 않음. 설정이 빠지면 placeholder 해석이 실패해 기동이 멈춤.
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?characterEncoding=UTF-8&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    # 스키마의 단일 소유자는 Flyway. Hibernate는 검증만 수행.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # JDBC 세션 타임존을 고정하지 않으면 서버 로캘에 따라 저장 시각이 달라짐.
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      connect-timeout: 1s
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        # 인증이 없는 엔드포인트이므로 health 외에는 비공개.
        include: health
  endpoint:
    health:
      # health 상세 비공개. 컴포넌트 이름·버전 노출 방지.
      # 장애 상태는 최상위 status로만 표시.
      show-details: never
  health:
    # 인증 없이 디스크·SSL 상세 비공개.
    diskspace:
      enabled: false
    ssl:
      enabled: false

logging:
  level:
    # DB 오류문에 포함될 수 있는 이메일과 recordkey 노출 방지.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF

app:
  # Daily/Monthly 집계 기준 타임존.
  business-zone: Asia/Seoul

  jwt:
    # Base64로 인코딩한 값. 디코딩 후 32바이트 미만이거나 Base64가 아니면 기동이 멈춤.
    # 토큰 유효시간은 응답 계약값이라 설정으로 열지 않고 코드 상수로 고정.
    secret: ${JWT_SECRET}
