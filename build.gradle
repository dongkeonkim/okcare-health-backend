plugins {
    // 개발_계획.md §4가 정한 Spring Boot 3.x 계열의 최신 패치. Maven Central의
    // spring-boot-gradle-plugin maven-metadata.xml에서 확인해 고정했다.
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

group = 'com.okcare'
version = '0.0.1-SNAPSHOT'

java {
    // 과제_원문.md가 지정한 Java 17. toolchain으로 고정해 로컬 JDK 차이와 무관하게 빌드한다.
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // 개발_계획.md §9의 @ConfigurationProperties + @Validated 설정 검증에 필요하다.
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.flywaydb:flyway-core'
    // MySQL 8은 Flyway가 별도 방언 모듈을 요구한다.
    implementation 'org.flywaydb:flyway-mysql'

    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 개발_계획.md §6.3의 "빈 MySQL에 전체 migration 적용" 검증에 사용한다.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
}

// Spring Security와 JWT, Spring REST Docs 의존성은 인증을 구현하는 경계 4에서 추가한다.
// 경계 3의 검증 대상은 개발_계획.md §12 기준으로 빌드와 세 컨테이너 healthcheck다.

tasks.named('test') {
    useJUnitPlatform()
}
