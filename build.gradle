plugins {
    // Maven Central의 maven-metadata.xml에서 확인한 3.x 최신 패치로 고정.
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

group = 'com.okcare'
version = '0.0.1-SNAPSHOT'

java {
    // toolchain으로 고정해 로컬에 설치된 JDK와 무관하게 같은 결과로 빌드.
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    jjwtVersion = '0.13.0'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // @ConfigurationProperties를 @Validated로 검증하는 데 필요.
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 스타터가 spring-security-crypto를 전이 포함하므로 PasswordEncoder용 명시 의존성은 두지
    // 않음. 스타터는 기본 필터 체인으로 모든 경로를 막으므로 SecurityConfig가 /actuator/health를
    // 반드시 열어 줘야 함. 막히면 Compose healthcheck가 실패해 세 컨테이너가 unhealthy가 됨.
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Spring Boot의 dependency-management 대상이 아니라 버전을 직접 고정. 세 아티팩트의 버전이
    // 어긋나면 컴파일은 통과하고 런타임에 ServiceLoader가 구현을 찾지 못해 발급이 실패함.
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    implementation 'org.flywaydb:flyway-core'
    // MySQL 8은 Flyway가 별도 방언 모듈을 요구.
    implementation 'org.flywaydb:flyway-mysql'

    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 빈 MySQL에 migration 전체를 적용하는 검증에 사용.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
}

tasks.named('test') {
    useJUnitPlatform()
}
