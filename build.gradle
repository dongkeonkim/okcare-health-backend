plugins {
    // Maven Central의 maven-metadata.xml에서 확인한 3.x 최신 패치로 고정.
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

group = 'com.okcare'
version = '0.0.1-SNAPSHOT'

java {
    // toolchain으로 고정해 로컬에 설치된 JDK와 무관하게 같은 결과로 빌드.
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // @ConfigurationProperties를 @Validated로 검증하는 데 필요.
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 전이 의존성이 없는 단일 아티팩트. spring-boot-starter-security와 달리 서블릿 필터
    // 체인을 구성하지 않아 actuator health가 열린 채로 유지됨. 스타터는 인증 경로가 생길 때 추가.
    implementation 'org.springframework.security:spring-security-crypto'

    implementation 'org.flywaydb:flyway-core'
    // MySQL 8은 Flyway가 별도 방언 모듈을 요구.
    implementation 'org.flywaydb:flyway-mysql'

    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 빈 MySQL에 migration 전체를 적용하는 검증에 사용.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
}

// JWT와 Spring REST Docs 의존성은 로그인과 API 문서를 구현할 때 추가.

tasks.named('test') {
    useJUnitPlatform()
}
